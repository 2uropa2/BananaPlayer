name: Build + smoke test

# CI for Banana Player. Runs on every push + PR against master and on
# manual trigger. Windows-only because Banana Player is Windows-only.
#
# The vcpkg install of FFmpeg is expensive (~30-45 min from cold). The
# GitHub Actions cache action keys off the vcpkg.json hash so we only
# re-pay that cost when dependency versions actually change. Steady-
# state builds finish in a few minutes.

on:
  push:
    branches: [ master, main ]
    tags:     [ "v*" ]        # tags trigger release-artifact upload
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # Persist vcpkg binary cache across runs. GitHub Actions cache
      # action honors this env var out of the box.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # vcpkg ships pre-installed on windows-latest runners at
      # C:\vcpkg. Use it directly; the vcpkg.json manifest tells
      # cmake which deps to fetch on configure.
      - name: Set VCPKG_ROOT
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:/vcpkg" >> $env:GITHUB_ENV

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        shell: pwsh
        run: build/Release/banana_tests.exe

      # Smoke test: exercise the whole init chain (SDL, ImGui, fonts,
      # UIController ctor, all sidecar loads, splash draw) without a
      # human at the keyboard. Any crash surfaces as non-zero exit.
      # Skipped on headless runner if we detect no display - the
      # windows-latest runner has one, so this should just work.
      - name: Smoke test (--check)
        shell: pwsh
        run: |
          $exe = "build/Release/BananaPlayer.exe"
          if (-not (Test-Path $exe)) { throw "BananaPlayer.exe not built" }
          & $exe --check
          if ($LASTEXITCODE -ne 0) {
            throw "Smoke test failed (exit=$LASTEXITCODE)"
          }

      # Package on tag pushes only. Produces both NSIS installer and
      # portable ZIP via CPack.
      - name: Package (CPack)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: build
        run: cpack -C Release -G "ZIP;NSIS"

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: BananaPlayer-${{ github.ref_name }}
          path: |
            build/*.zip
            build/*.exe
          if-no-files-found: error

      # Attach both artifacts to the corresponding GitHub Release.
      # Only fires for tagged pushes.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/*.exe
          draft: true            # human reviews before publishing
          generate_release_notes: true
